  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="text/javascript">
      window.$crisp = [];
      window.CRISP_WEBSITE_ID = "de88025b-ebb5-4786-9c29-2cb12b47144b";
      (function () {
        d = document;
        s = d.createElement("script");
        s.src = "https://client.crisp.chat/l.js";
        s.async = 1;
        d.getElementsByTagName("head")[0].appendChild(s);
      })();
    </script>
    <style>
      /* Lift the Crisp launcher above the mobile bottom navigation (More button).
         Crisp wraps the launcher in .crisp-client and an iframe with classes prefixed by `crisp-`. */
      .crisp-client,
      .crisp-client > div,
      .crisp-client a[class*="cc-"],
      iframe.crisp-client,
      iframe[class*="crisp-"][src*="client.crisp.chat"] {
        bottom: 84px !important;
      }
      @media (min-width: 768px) {
        .crisp-client,
        .crisp-client > div,
        .crisp-client a[class*="cc-"],
        iframe.crisp-client,
        iframe[class*="crisp-"][src*="client.crisp.chat"] {
          bottom: 20px !important;
        }
      }
    </style>
    <script>
      // Also push Crisp via its native API so the launcher iframe is correctly offset.
      window.$crisp = window.$crisp || [];
      function applyCrispOffset() {
        var isMobile = window.matchMedia('(max-width: 767px)').matches;
        window.$crisp.push(["set", "container:offset", [[isMobile ? 84 : 20, 16]]]);
      }
      applyCrispOffset();
      window.addEventListener('resize', applyCrispOffset);
    </script>
  </body>
